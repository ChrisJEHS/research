<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Navbar Example</title>
  <!-- Link to external CSS stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="logo">MyBrand</div>
    
    <!-- Hamburger Icon (Three Lines) -->
    <div class="menu-toggle" id="mobile-menu">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </div>

    <!-- Navigation Links for 5 Sections -->
    <ul class="nav-list">
      <li><a href="#home">Home</a></li>
      <li><a href="#about">About</a></li>
      <li><a href="#services">Services</a></li>
      <li><a href="#portfolio">Portfolio</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </nav>

  <!-- Page Sections (for testing navigation links) -->
  <section id="home" class="section">Home Section</section>
  <section id="about" class="section">About Section</section>
  <section id="services" class="section">Services Section</section>
  <section id="portfolio" class="section">Portfolio Section</section>
  <section id="contact" class="section">Contact Section</section>

  <!-- Link to external JavaScript file -->
  <script src="style.js"></script>

</body>
</html>
